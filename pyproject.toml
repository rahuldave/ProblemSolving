[project]
name = "problemsolving"
version = "0.1.0"
description = "Arithmetic methods classified by first step, and a step-by-step tutor prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["v2"]
testpaths = ["v2/tests"]
